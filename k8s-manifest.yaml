apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-distribuidos
  labels:
    app: app-distribuidos
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app-distribuidos
  template:
    metadata:
      labels:
        app: app-distribuidos
    spec:
      containers:
      - name: web
        image: app-distribuidos:v1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: servicio-distribuidos
spec:
  type: NodePort
  selector:
    app: app-distribuidos
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8080
    nodePort: 30080