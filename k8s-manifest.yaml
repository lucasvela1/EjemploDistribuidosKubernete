apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: app-distribuidos-role
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "delete"]
- apiGroups: ["apps"]
  resources: ["deployments", "deployments/scale"]
  verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: app-distribuidos-rb
subjects:
- kind: ServiceAccount
  name: default
  namespace: default
roleRef:
  kind: Role
  name: app-distribuidos-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-distribuidos
  labels:
    app: app-distribuidos
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app-distribuidos
  template:
    metadata:
      labels:
        app: app-distribuidos
    spec:
      terminationGracePeriodSeconds: 1
      containers:
      - name: web
        image: app-distribuidos:v1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: servicio-distribuidos
spec:
  type: NodePort
  selector:
    app: app-distribuidos
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8080
    nodePort: 30080
